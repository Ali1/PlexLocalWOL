# Generated by scripts/dependency-security/build-routine-classifier.py in Personal Ops.
# Copy to .github/workflows/dependabot-routine-classifier.yml; no PR checkout/execution.
# This tag is generation provenance only. The existing hourly worker independently
# checks ALL native security relationships before Project/AI exemption.
name: Classify routine Dependabot proposals
'on':
  pull_request_target:
    types: [opened, reopened, synchronize, edited]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: dependabot-routine-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  classify:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Tag verified version-only generation; worker validates native security
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          def signed_dependency_entries(commit):
              """Read the plain per-dependency metadata emitted in verified bot commits."""
              message=commit['commit']['message']
              blocks=re.findall(r'^---\nupdated-dependencies:\n(.*?)^\.\.\.\s*$',message,re.M|re.S)
              if len(blocks)!=1:return None
              entries=re.split(r'^- dependency-name: ',blocks[0],flags=re.M)
              if entries[0].strip() or len(entries)<2:return None
              result=[];group_count=0
              for entry in entries[1:]:
                  group=re.findall(r'^  dependency-group: ([a-z0-9-]+)$',entry,re.M)
                  types=re.findall(r'^  update-type: (version-update:semver-(?:major|minor|patch))$',entry,re.M)
                  if len(group)>1 or len(types)!=1:return None
                  group_count+=len(group)
                  result.append((entry.splitlines()[0],group[0] if group else None))
              if message.count('dependency-group:')!=group_count:return None
              return result

          def signed_dependency_group(commit):
              """A group is repeated at two spaces on EVERY dependency in real commits."""
              entries=signed_dependency_entries(commit)
              groups={group for _,group in entries} if entries else set()
              return next(iter(groups)) if len(groups)==1 else None

          def routine_provenance(pull, commit, config, repo, default_branch, native_urls):
              """Conservative stdlib-only subset of Dependabot's verified metadata contract.

              Config recognises only the documented, generated indentation below. Other
              YAML formats/aliases are deliberately unknown, never a reason to exempt.
              This is classification, not a security assessment or compatibility claim.
              """
              try:
                  if (pull['state']!='open' or pull['user']['login']!='dependabot[bot]'
                          or pull['head']['repo']['full_name']!=repo or pull['base']['repo']['full_name']!=repo
                          or pull['base']['ref']!=default_branch or pull['html_url'] in native_urls
                          or commit['sha']!=pull['head']['sha'] or commit['author']['login']!='dependabot[bot]'
                          or commit['commit']['verification']['verified'] is not True):return False
                  group=signed_dependency_group(commit)
                  if not group or not group.startswith('routine-maintenance-'):return False
                  if not re.fullmatch(r'dependabot/[^/]+/(?:[^/]+/)*'+re.escape(group)+r'-[a-f0-9]{8,64}',pull['head']['ref']):return False
                  # Only a plain, unique group in a standard groups block is accepted.
                  # Reject YAML indirection/merge keys/flow maps rather than partially parse them.
                  if re.search(r'[\t]|(?:^|\s)[&*][a-zA-Z_]|<<:',config):return False
                  matches=list(re.finditer(r'^      '+re.escape(group)+r':\s*\n((?:        [^\n]*\n|\n)+)',config,re.M))
                  if len(matches)!=1 or len(re.findall(re.escape(group)+r':',config))!=1:return False
                  prefix=config[:matches[0].start()].splitlines()
                  parent=next((line for line in reversed(prefix) if line.strip() and not line.lstrip().startswith('#') and len(line)-len(line.lstrip())<6),'')
                  if parent!='    groups:':return False
                  block=matches[0][1]
                  return len(re.findall(r'^        applies-to: version-updates\s*$',block,re.M))==1 and block.count('applies-to:')==1
              except (KeyError,TypeError,AttributeError):return False

          import base64, json, os, re, subprocess, urllib.parse

          def api(endpoint,payload=None,method=None):
              args=['gh','api',endpoint]
              if method:args+=['--method',method]
              if payload is not None:args+=['--input','-']
              p=subprocess.run(args,input=json.dumps(payload) if payload is not None else None,capture_output=True,text=True,timeout=90)
              if p.returncode:
                  if 'HTTP 404' in p.stderr:raise FileNotFoundError('GitHub config absent')
                  raise RuntimeError('GitHub evidence unavailable')
              data=json.loads(p.stdout) if p.stdout else None
              if isinstance(data,dict) and data.get('errors'):raise RuntimeError('Incomplete GitHub evidence')
              return data

          def label(present):
              ep=f'repos/{repo}/issues/{number}/labels'
              current={x['name'] for x in api(ep)}
              if (name in current)==present:return
              if present:
                  # POST creation is idempotent for an already existing label (422).
                  p=subprocess.run(['gh','api',f'repos/{repo}/labels','--input','-'],input=json.dumps({'name':name,'color':'c2e0c6','description':'Verified version-only Dependabot proposal; monthly Ops review'}),capture_output=True,text=True,timeout=90)
                  if p.returncode and 'already_exists' not in p.stderr and 'already_exists' not in p.stdout:raise RuntimeError('Label setup failed')
                  api(ep,{'labels':[name]})
              else:api(ep+'/'+urllib.parse.quote(name,safe=''),method='DELETE')
              if (name in {x['name'] for x in api(ep)})!=present:raise RuntimeError('Label readback failed')

          event=json.load(open(os.environ['GITHUB_EVENT_PATH']))
          repo=os.environ['GITHUB_REPOSITORY'];number=event['pull_request']['number']
          name='dependencies: routine-update'
          try:
              pull=api(f'repos/{repo}/pulls/{number}')
              branch=api(f'repos/{repo}')['default_branch']
              commit=api(f'repos/{repo}/commits/{pull["head"]["sha"]}')
              config=None
              for filename in ('dependabot.yml','dependabot.yaml'):
                  config_ep=f'repos/{repo}/contents/.github/{filename}?ref='+urllib.parse.quote(branch,safe='')
                  try:raw=api(config_ep)
                  except FileNotFoundError:continue
                  config=base64.b64decode(raw['content']).decode('utf-8');break
              routine=config is not None and routine_provenance(pull,commit,config,repo,branch,set())
              if routine:
                  fresh=api(f'repos/{repo}/pulls/{number}')
                  if fresh!=pull or base64.b64decode(api(config_ep)['content']).decode('utf-8')!=config:raise RuntimeError('Concurrent PR/config change')
                  routine=routine_provenance(fresh,commit,config,repo,branch,set())
              label(routine)
          except Exception:
              label(False)
              raise RuntimeError('Routine exemption withheld; authoritative hourly worker will recheck') from None
          PY
