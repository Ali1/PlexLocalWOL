# Monthly routine version proposals; security updates remain independent.
# Full Ops still owns runtime/EOL and provider/API lifecycle review.
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: monthly
      time: 06:00
      timezone: Europe/London
    open-pull-requests-limit: 2
    groups:
      routine-maintenance-composer-root:
        applies-to: version-updates
        patterns:
          - '*'
