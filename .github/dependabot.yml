# Estate policy: Dependabot opens security updates only.
# Routine currency, EOL and provider/API changes belong to quarterly Full Ops.
version: 2

updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 0
